<!-- kmp-toolkit / concept a / mark — single colour via currentColor -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256" color="#0A0D0C">
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- warps (structure) -->
  <line x1="16" y1="10" x2="16" y2="38" stroke="currentColor" stroke-width="4"/>
  <line x1="32" y1="10" x2="32" y2="38" stroke="currentColor" stroke-width="4"/>
  <!-- centre warp, broken so the weft at y=24 passes under it -->
  <line x1="24" y1="10" x2="24" y2="21" stroke="currentColor" stroke-width="4"/>
  <line x1="24" y1="27" x2="24" y2="38" stroke="currentColor" stroke-width="4"/>
  <!-- wefts (trace) -->
  <line x1="12" y1="16" x2="40" y2="16" stroke="currentColor" stroke-width="2"/>
  <line x1="12" y1="24" x2="40" y2="24" stroke="currentColor" stroke-width="2"/>
  <line x1="12" y1="32" x2="40" y2="32" stroke="currentColor" stroke-width="2"/>
  <!-- ghost: a fourth warp, trace weight, +4 on x -->
  <line x1="36" y1="10" x2="36" y2="38" stroke="currentColor" stroke-width="2"/>
  <!-- the dot: first crossing -->
  <circle cx="16" cy="16" r="3" fill="currentColor"/>
</g>
</svg>
