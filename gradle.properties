# JVM: a larger heap + capped Metaspace + parallel GC — eases the Metaspace OOMs a 30+ module KMP
# build (android/ios/jvm/wasm) hits during KSP/Room/compose processing.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache ON. The "broad audit is a separate pass" note that stood here was a deferred
# chore, not a recorded incompatibility, and the audit has now been run on Gradle 9.8.0-rc-2 /
# Kotlin 2.4.20 / AGP 9.5.0-alpha06:
#
#   ./gradlew assemble check -Pkotlin.native.ignoreDisabledTargets=true --dry-run \
#       --configuration-cache --configuration-cache-problems=warn   -> 0 problems
#   ./gradlew check -Pkotlin.native.ignoreDisabledTargets=true \
#       --configuration-cache --configuration-cache-problems=fail    -> BUILD SUCCESSFUL
#
# problems=warn is deliberately NOT set. warn stores an entry despite problems and lets a task run
# against incomplete deserialized state, so the build stays green while it misbehaves. The audit
# came back clean, so the default (fail) is what we want: a NEW incompatibility should be a red
# build at the commit that introduces it, not a line in a report nobody reads.
#
# Measured on a warm incremental `assemble -Pkotlin.native.ignoreDisabledTargets=true`
# (--no-parallel --max-workers=2): 21.0s / 27.6s without, 2.7s / 3.5s with. The configuration phase
# alone is 3.7s of every invocation on this 43-module tree; the cache skips it.
#
# Exception already in place: publish-maven-central.yml passes --no-configuration-cache, because
# the publish + signing path is the one that genuinely is not CC-safe. Leave that flag there.
org.gradle.configuration-cache=true

# Four android.* properties were deleted here. All four were being set to the value AGP already
# uses, so they bought nothing, and two are on AGP's removal path. Read straight out of the AGP in
# use rather than from release notes (Google has published none for 9.5):
#
#   javap -p -c <gradle-9.5.0-alpha06.jar>/com/android/build/gradle/options/BooleanOption.class
#
#     android.useAndroidX                      default true   ApiStage.Deprecated -> VERSION_10_0
#     android.nonTransitiveRClass              default true   ApiStage.Stable
#     android.defaults.buildfeatures.resvalues default false  ApiStage.Deprecated -> VERSION_10_0
#     android.defaults.buildfeatures.shaders   default false  ApiStage.Stable
#
# The resvalues/shaders comment claimed "a small build-time trim". It was not one: AGP 9.0 flipped
# both defaults to false, so the lines had been inert since the AGP 9 bump. No module in this tree
# uses resValue or ships shaders, so nothing needs the per-module opt-in either.

kotlin.incremental=true
kotlin.mpp.stability.nowarn=true
kotlin.code.style=official
# kotlin.native.ignoreDisabledTargets is deliberately NOT set here.
#
# As a global property it applied to every build on every host, so `assemble` and `check` skipped
# iosArm64 / iosSimulatorArm64 for all 28 iOS-declaring modules and still reported success. CI runs
# on Linux, so that meant no iOS source set in this repo was ever compiled by anything. It is now
# passed with -P on the Linux CI leg only (.github/workflows/ci.yml), where it is the truth; the
# ios-compile job on macOS runs without it so an Apple break is a red build, not a silent skip.
#
# A Mac developer who wants the old skip behaviour can pass -Pkotlin.native.ignoreDisabledTargets=true
# on the command line.
