# The three versions that must move together across kmp-toolkit, kmp-build-logic and every consumer
# app. A Gradle composite build requires the included build's plugin versions to agree with the
# root's, so a repo on its own triple cannot resolve the toolkit at all — it fails to configure.
#
# toolchain-watch.yml reads this file, compares each axis against what upstream has published, and
# opens ONE pull request when a newer version exists and is not held. Dependabot is configured to
# ignore these three coordinates in every repo precisely so they only ever move through here.
#
# `hold` pins an axis and states why. Remove the hold to let the watcher propose it again.

axes:
  - key: agp
    metadata: https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml

  - key: kotlin
    metadata: https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml

  - key: compose-multiplatform
    metadata: https://repo1.maven.org/maven2/org/jetbrains/compose/compose-gradle-plugin/maven-metadata.xml
    # Hold LIFTED 2026-08-02. It was never a Compose bug to wait out.
    #
    # beta02 and beta03 both stop the generated compose-resources `Res` class landing on the
    # androidMain compilation source path for a KMP LIBRARY that also targets wasmJs. Two
    # consecutive releases failing identically said this was a deliberate change in how library
    # resources are wired, not a regression — so waiting for beta04 was waiting for nothing.
    #
    # The real fault was ours: PaymentsLab's core/designsystem carried a brand typeface inside a
    # brand-neutral design-system library, which its own contract forbids. Moving the font to the
    # app as a plain Android res/font resource (PaymentsLab#16) removed the compose-resources
    # dependency entirely, and core/designsystem + :app + :web all compile on beta03.
    #
    # Mileway also carries compose resources in libraries (core/ui, feature/whatsnew) and was
    # verified green on beta03 independently — its core/ui targets desktop rather than wasmJs, which
    # is what made it immune all along and is the strongest evidence for the wasmJs trigger.
    #
    # If a future CMP breaks a library again, prefer asking whether that library should own the
    # resource before pinning six repos to protect it.
