name: Publish to Maven Central

# Publishes the curated module set to io.github.darkpandawarrior.
#
# Needs four secrets. Until they exist this workflow fails loudly at the check below rather than
# running a publish that silently uploads nothing:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  user token from central.sonatype.com
#   SIGNING_KEY                                      ASCII-armoured GPG secret key
#   SIGNING_PASSWORD                                 its passphrase
#
# Central requires every artifact signed, plus sources and javadoc jars. The vanniktech plugin
# produces all of that; see the Maven Central block in build.gradle.kts.
#
# RUNS ON macOS, and must. Apple targets only build on a Mac host, so an ubuntu publish emitted
# Gradle module metadata with no iosArm64 / iosSimulatorArm64 variant for any of the 28
# iOS-declaring modules. Nothing failed: the upload succeeded, the job was green, and any external
# consumer resolving com.siddharth.kmp:* from an iosMain source set got "no matching variant" at
# resolution time instead. The four family apps never hit it because they vendor this repo through
# includeBuild and resolve project paths, not published coordinates. The metadata assertion after
# the publish step is what stops that shipping again.

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Publish to the local repo only, do not upload"
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Refuse to run without credentials
        if: ${{ !inputs.dryRun }}
        env:
          U: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          K: ${{ secrets.SIGNING_KEY }}
        run: |
          # A publish job that skips its upload and still reports green is worse than one that fails.
          test -n "$U" || { echo "::error::MAVEN_CENTRAL_USERNAME is not set"; exit 1; }
          test -n "$K" || { echo "::error::SIGNING_KEY is not set"; exit 1; }

      - uses: actions/setup-java@v5
        with: { java-version: '17', distribution: 'temurin' }

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            ./gradlew publishToMavenLocal --no-configuration-cache
            echo "### Dry run: published to the local repo only" >> "$GITHUB_STEP_SUMMARY"
          else
            ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
            echo "### Published io.github.darkpandawarrior to Maven Central" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Mirrors the "Refuse to run without credentials" guard above: assert the thing that was
      # silently wrong, at the artifact, rather than trusting the publish task's exit code.
      - name: Assert the module metadata carries an iOS variant
        run: |
          set -euo pipefail
          # The four modules in `centralModules` (build.gradle.kts). All are KMP and all declare
          # iosArm64 + iosSimulatorArm64, so every one of them must carry an Apple variant.
          for m in result common mvi-core network; do
            meta="$m/build/publications/kotlinMultiplatform/module.json"
            test -f "$meta" || {
              echo "::error::$m produced no Gradle module metadata at $meta"; exit 1; }
            grep -q 'iosArm64' "$meta" || {
              echo "::error::$m module metadata has no iosArm64 variant. This publish would hand any"
              echo "::error::external consumer resolving from an iosMain source set a 'no matching"
              echo "::error::variant' failure. Apple targets need a Mac host — check runs-on."
              exit 1; }
            echo "ok: $m carries an iosArm64 variant"
          done

      - name: Show what was produced
        run: |
          find ~/.m2/repository/io/github/darkpandawarrior -name '*.pom' 2>/dev/null \
            | sed 's|.*/darkpandawarrior/||' | sort | head -30 || true
