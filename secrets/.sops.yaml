# .sops.yaml — encryption rules for this vault.
#
# Modeled on kmp-project-template's Path B vault mode (deployment/BOOTSTRAP.md,
# docs/claude/secrets-management.md).
#
# path_regex matches the PLAINTEXT SOURCE, not the encrypted output. sops picks a creation rule by
# the path of the file it is READING, so a rule that only matched `*.enc.yaml` could never fire on
# `sops -e vault/example.secrets.yaml` — it failed with "no matching creation rules found", which is
# why test.sh had never once passed since this vault was written.
#
# The recipient below is a real age public key. Public keys are safe to commit; the matching private
# key lives at ~/.config/sops/age/keys.txt (mode 600, outside every repo), is mirrored into the
# PRIVATE data repo by AgentHarness backup-sources.conf, and is in this machine's Keychain as
# "sops-age-identity". Encrypted vaults may therefore be committed to PUBLIC repos safely — that
# separation is the entire point.
#
creation_rules:
  - path_regex: vault/.*\.ya?ml$
    age: age1wczux4nptyhmggxk2xp993gsfkhgp86gclddx0s4t4zssa3fzeaq2ghwj5
