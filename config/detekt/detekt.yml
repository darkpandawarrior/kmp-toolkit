# =============================================================================
# config/detekt/detekt.yml — the family standard.
# Canonical copy: kmp-toolkit/config/detekt/detekt.yml. This repo is VENDORED into the
# consumer apps, so this file is the one the apps inherit their conventions from.
#
# Toolchain: dev.detekt 2.0.0-alpha.6 (NOT io.gitlab.arturbosch.detekt 1.x).
# Rules that only exist in 1.x (UnusedPrivateMember, MayBeConst) are deliberately absent —
# detekt 2.0 can never emit them, and listing them makes the file look richer than it is.
#
# HOW TO READ THE EXCLUSIONS
#   Every `excludes:` and every `active: false` below carries the reason it is an artefact.
#   Adding one without a reason creates next year's mystery. A suppression that cannot state
#   why the finding is WRONG is debt, and belongs in the code as a fix instead.
#
# THE TRAP THAT MAKES THIS FILE FRAGILE
#   detekt's `excludes:` REPLACES the built-in default list, it does not extend it. Omitting
#   the test globs from naming.FunctionNaming turns every backtick-named test function into a
#   violation. So the *notOurs anchor below re-lists detekt 2.0's defaults IN FULL, plus the
#   KMP test source sets detekt ships no default for but this family targets (desktopTest,
#   wasmJsTest, watchosTest, appleTest, nativeTest).
#   Sixteen globs repeated across a dozen rules WILL drift, and a silently-wrong excludes list
#   silently disables a rule. Anchor once, alias everywhere. SnakeYAML expands the anchor
#   before detekt's config validation runs, so `config.validation: true` stays on.
#
#   This repo ALSO carries the belt-and-braces form in build.gradle.kts:
#     tasks.withType<dev.detekt.gradle.Detekt>().configureEach {
#         exclude("**/build/**", "**/generated/**")
#     }
#   which covers every rule, including ones enabled later that nobody remembers to alias.
#   Both are kept: a repo that vendors this config without the root convention must not
#   silently lose the exclusion.
# =============================================================================

config:
  validation: true
  warningsAsErrors: false

# -----------------------------------------------------------------------------
comments:
  # KDoc-on-everything produces noise, not documentation, in a UI-heavy codebase.
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

# -----------------------------------------------------------------------------
complexity:
  CyclomaticComplexMethod:
    # The full glob list lives here once and is aliased as *notOurs below.
    excludes: &notOurs
      - '**/build/generated/**'   # KSP/Room/Compose-resources output. Machine-written names
                                  # nobody can change, rewritten identically after every clean.
                                  # This repo has none under `src`, but the apps that vendor
                                  # this config do — 66% of the family's baseline was this.
      # --- detekt 2.0's own defaults, restored verbatim. Do not drop any of these. ---
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      # --- KMP source sets this family targets that detekt 2.0 ships no default for. ---
      # MEASURED, not copied: AGP's KMP library plugin names the Android test source sets
      # `androidHostTest` and `androidDeviceTest`, NOT `androidUnitTest`/`androidInstrumentedTest`.
      # detekt 2.0's defaults cover the old names only, so without these two lines FunctionNaming
      # flagged every backtick-named test in this repo (12 of them) the moment the rule came off
      # `active: false`. That is the `excludes:`-replaces-the-defaults trap firing for real.
      - '**/androidHostTest/**'
      - '**/androidDeviceTest/**'
      - '**/desktopTest/**'
      - '**/wasmJsTest/**'
      - '**/watchosTest/**'
      - '**/appleTest/**'
      - '**/nativeTest/**'
      - '**/*.kts'                # Gradle scripts are configuration, not application logic.
    allowedComplexity: 20         # Family number. Game-rule and payment-orchestration state
                                  # machines are legitimately branchy.
    ignoreSimpleWhenEntries: true # A `when` over a sealed UiState is ONE decision expressed in
                                  # N arms, not N decisions. Honest reading of the metric.
  LongMethod:
    excludes: *notOurs
    allowedLines: 80
    ignoreAnnotated: &composable
      # Both forms on purpose. detekt's per-source-set KMP tasks run WITHOUT type resolution,
      # so FQN matching is not guaranteed; detekt's own Compose guide uses the simple name.
      - 'Composable'
      - 'androidx.compose.runtime.Composable'
  LongParameterList:
    excludes: *notOurs
    allowedFunctionParameters: 10      # A Compose entry point takes host + nav callbacks +
    allowedConstructorParameters: 10   # modifier + VM default.
    ignoreDefaultParameters: true      # A parameter with a default is not a burden on callers.
    ignoreAnnotated: *composable
  TooManyFunctions:
    excludes: *notOurs
    allowedFunctionsPerFile: 40
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 15
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 10
    ignoreAnnotatedFunctions:
      # ARTEFACT. A file holding thirty composables is a component catalogue; a file holding
      # thirty previews is a preview sheet. Neither is a god class. Prescribed by detekt's own
      # Compose guide: https://detekt.dev/docs/introduction/compose/
      # Ordinary classes past 20 methods are deliberately NOT covered and still fire.
      - 'Composable'
      - 'Preview'
  LargeClass:
    excludes: *notOurs
  NestedBlockDepth:
    excludes: *notOurs
  ComplexCondition:
    excludes: *notOurs
    active: true                  # Four or more boolean terms in one `if` is where the
                                  # off-by-one lives. Extract a named predicate.

# -----------------------------------------------------------------------------
coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

# -----------------------------------------------------------------------------
empty-blocks:
  EmptyFunctionBlock:
    excludes: *notOurs
    ignoreOverridden: true
    # ARTEFACT. Every hit in this family is an `override fun x() {}`: no-op test doubles,
    # unimplemented platform stubs, and listener adapters where only one callback of four is
    # wanted. For an override, the empty body IS the implementation. An empty NON-override — a
    # function somebody forgot to finish — still fires, which is the case the rule exists for.
    # `active: false` would have hidden both.

# -----------------------------------------------------------------------------
exceptions:
  TooGenericExceptionCaught:
    excludes: *notOurs
    active: true
    # DELIBERATELY OVERTURNS the `active: false` carried by two sibling repos, whose recorded
    # reason is "runCatching { } is idiomatic in this codebase". That reason does not hold:
    # this rule fires on `catch` clauses, and runCatching {} has none — it returns a Result. It
    # never triggered the rule. Re-enabling surfaces genuine findings.
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'NullPointerException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignored)'
    # A broad catch whose variable is named `_` or `ignored` has said on the page that the
    # breadth is deliberate. That is the escape hatch — not a baseline entry.
  SwallowedException:
    excludes: *notOurs
    active: true                  # A swallowed exception in a payment or security path is the
                                  # bug you get paged for. Last rule in the family to turn off.
    allowedExceptionNameRegex: '_|(ignored|expected)'
  TooGenericExceptionThrown:
    excludes: *notOurs
    active: true

# -----------------------------------------------------------------------------
naming:
  ClassNaming:
    excludes: *notOurs
    # ARTEFACT in the apps: every hit is `AgentDao_Impl : AgentDao`. Room's KSP contract is to
    # name the generated implementation <Dao>_Impl; the underscore is Room's, not a style choice.
  VariableNaming:
    excludes: *notOurs
    # ARTEFACT in the apps (99.84%): Room's generated `__db`, `__insertAdapterOf…`,
    # `_columnIndexOf…`. The rule stays ON because the handful of survivors are real — a local
    # SCREAMING_SNAKE `val MONTHS = arrayOf(...)` reallocated on every recomposition is exactly
    # the finding a blanket disable would have hidden forever.
  ConstructorParameterNaming:
    excludes: *notOurs
  FunctionParameterNaming:
    excludes: *notOurs
  FunctionNaming:
    excludes: *notOurs
    ignoreAnnotated: *composable
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    # Belt AND braces, and a deliberate upgrade from this repo's previous `active: false`.
    # `ignoreAnnotated` is the precise instrument, but if the annotation fails to match under a
    # task running without type resolution, EVERY composable becomes a violation at once. The
    # permissive pattern is the proven fallback. Keeping both makes the outcome independent of
    # detekt's resolution mode — and unlike `active: false`, a genuinely misnamed function
    # (underscores, leading digits) still fires.
  TopLevelPropertyNaming:
    excludes: *notOurs
    constantPattern: '[A-Z][_A-Z0-9]*|[A-Z][A-Za-z0-9]*'
    # A UNION, and measured rather than copied. The family standard prescribes PascalCase alone
    # (Compose's API guidelines; detekt's Compose guide), which is right for the app repos'
    # `private const val BonusCap = 150` style constants.
    # kmp-toolkit is not those repos: it holds 60+ SCREAMING_SNAKE top-level consts
    # (SAMPLE_RATE, LAN_UDP_PORT, BYTES_PER_MB, APPLE_TEAM_ID…) which are correct under Kotlin's
    # own coding conventions, and several of which are PUBLISHED API on Maven Central.
    # PascalCase-only would have minted ~60 brand-new findings here and invited renaming
    # published symbols for a style preference. The union admits both in-house idioms and still
    # rejects camelCase and leading-underscore names, which is what the rule is for.
    # NOTE this is NOT the broken '[A-Z][_A-Z0-9]*|[a-z][a-zA-Z0-9]*' a sibling repo carries —
    # that alternation can never match PascalCase, which is why all its hits kept firing.
  MatchingDeclarationName:
    active: false
    # DELIBERATE IDIOM, not laziness. Small related declarations are grouped per file:
    # Freshness.kt holds FreshnessBand, Feedback.android.kt holds FeedbackAndroid.
    # MUST stay paired with `ktlint_standard_filename = disabled` in .editorconfig — one
    # without the other just moves the noise between two tools that then disagree.
  InvalidPackageDeclaration:
    excludes: *notOurs
    active: true                  # Never baseline a package/directory mismatch — it breaks IDE
                                  # navigation and symbol-level codegraph queries. `git mv`.

# -----------------------------------------------------------------------------
performance:
  SpreadOperator:
    active: false                 # Vararg spreading is idiomatic Kotlin at several engine and
                                  # DI call sites; the array-copy cost is irrelevant at these
                                  # call frequencies.
  ForEachOnRange:
    excludes: *notOurs
    active: true                  # `(0..n).forEach` allocates; `for (i in 0..n)` does not and
                                  # is not less readable.

# -----------------------------------------------------------------------------
style:
  MagicNumber:
    excludes: *notOurs
    active: true
    # NOT AN ARTEFACT RULE, and the one most often surrendered to (`active: false`).
    # A bare 111320.0 in a Kalman smoother (metres per degree of latitude) or a bare 256 in
    # KeystoreCrypto (AES key size) is the exact defect this rule exists to catch. Turning it
    # off to make a number go down is rubber-stamping the debt.
    ignorePropertyDeclaration: true          # `val CardRadius = 16.dp` is self-documenting.
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreNamedArgument: true                # `alpha = 0.6f` names itself at the call site.
    ignoreEnums: true
      # ARTEFACT. `TurnSpeed.SLOW(1.4f)` — the enum entry name IS the name of the number.
      # Extracting a constant to feed one enum entry adds indirection and no information.
    ignoreAnnotated:
      # 16.dp / 0.6f alpha / 1f weight are Compose's vocabulary inside a @Composable tree.
      # HONEST LIMIT: `DrawScope` extension functions and Canvas draw lambdas carry no
      # annotation, so no annotation-based ignore reaches them. That is the right outcome —
      # a 0.86f needle-radius fraction IS worth naming.
      - 'Composable'
      - 'androidx.compose.runtime.Composable'
      - 'Preview'
      - 'androidx.compose.ui.tooling.preview.Preview'
    ignoreNumbers:
      # Keep this list SHORT. The previous list ran 0 through 10 inclusive, which silently
      # exempted `if (retries > 5)` and `grade >= 7`, and carried '1000' — a 1000 ms debounce is
      # a timing that deserves a name. -1/0/1/2 are detekt's defaults (identity, empty,
      # off-by-one, halving); 100 is percentage conversion; 360 is degrees.
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
      - '360'
  MaxLineLength:
    active: false
    # NOT forgiveness — a SINGLE-OWNER decision. ktlint's standard:max-line-length owns line
    # length for this family, via .editorconfig, at ONE number. Two tools enforcing one rule at
    # two different numbers is how the family ended up with detekt at its 120 default and
    # .editorconfig at 160 in three repos and 120 in a fourth.
  WildcardImport:
    active: false
    # Compose and the design-system modules pull dozens of symbols per file and the IDE
    # collapses them. MUST stay paired with `ktlint_standard_no-wildcard-imports = disabled`.
  ForbiddenComment:
    active: false                 # TODO(ios)/TODO(wasm) markers track real unimplemented
                                  # platform actuals in a KMP tree; they are a map, not rot.
  ReturnCount:
    excludes: *notOurs
    max: 4
    excludeGuardClauses: true
    # `?: return` / `if (x == null) return` at the top of a function are preconditions, not
    # branches. Four real returns AFTER guards still fires, so the rule keeps its teeth.
  ThrowsCount:
    excludes: *notOurs
    max: 3
    excludeGuardClauses: true     # `require`/`check` at the top of a function are precondition
                                  # declarations, not control flow.
                                  # NOTE ThrowsCount lives under `style` in detekt 2.0, not under
                                  # `exceptions` as it did in 1.x. config.validation caught this;
                                  # in the wrong ruleset it fails the build outright.
  MayBeConstant:
    excludes: *notOurs
    active: true                  # `const val` is free and removes a field read per access.
  FunctionOnlyReturningConstant:
    excludes: *notOurs
    active: true
    ignoreOverridableFunction: true
    ignoreActualFunction: true    # A KMP `actual fun` returning a constant on one platform is
                                  # the whole point of expect/actual — the contract, not a smell.
  UnusedParameter:
    excludes: *notOurs
    allowedNames: '_|ignored|expected'
    # NOT an artefact. In a shared library module dead parameter surface propagates to every
    # consumer, and the next reader cannot tell a placeholder from a bug. Delete it or wire it up.
  UnusedPrivateFunction:
    excludes: *notOurs
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    ignoreAnnotated:
      # ARTEFACT: a @Preview function is invoked by the IDE and by screenshot tests, never by
      # application code. Prescribed by detekt's Compose guide.
      - 'Preview'
      - 'androidx.compose.ui.tooling.preview.Preview'
  UnusedPrivateProperty:
    excludes: *notOurs
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  UnusedPrivateClass:
    excludes: *notOurs
    active: true
  LoopWithTooManyJumpStatements:
    excludes: *notOurs
    maxJumpCount: 2
    # One `continue` guard plus one `break` on the success case is a normal, readable scan loop,
    # against detekt's default of 1. Three jumps still fires.
